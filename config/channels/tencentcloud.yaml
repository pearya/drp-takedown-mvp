provider_key: tencentcloud
channels:
  - channel_id: tencentcloud-security-ticket
    provider_role: dns
    region: CN
    route_type: browser_form
    executor: playwright
    template_key: takedown_ticket
    entry_url: https://console.cloud.tencent.com/workorder/category
    requires_login: true
    auth_profile: tencentcloud_ops
    captcha_strategy: manual_takeover
    attachments:
      required:
        - phishing_screenshot
      optional:
        - business_license
        - trademark_certificate
  - channel_id: tencentcloud-security-email
    provider_role: dns
    region: CN
    route_type: email
    executor: email
    template_key: takedown_email
    send_to: security@tencent.com
    captcha_strategy: none
    attachments:
      required:
        - phishing_screenshot
  - channel_id: tencentcloud-hosting-email
    provider_role: ip_hosting
    region: CN
    route_type: email
    executor: email
    template_key: takedown_email
    send_to: security@tencent.com
    captcha_strategy: none
    attachments:
      required:
        - phishing_screenshot
